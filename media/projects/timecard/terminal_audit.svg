<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="0" y="0" width="900" height="620" rx="14" fill="url(#termGrad)" stroke="#1f293d" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="0" y="0" width="900" height="42" rx="14" fill="#0f1622" />
  <rect x="0" y="28" width="900" height="14" fill="#0f1622" />
  <line x1="0" y1="42" x2="900" y2="42" stroke="#1f293d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="450" y="26" fill="#7d8b99" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" text-anchor="middle">bash — python3 main.py (Timecard Shift Compliance Engine)</text>

  <!-- Terminal Content Area -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="12.5" xml:space="preserve">
    <!-- Prompt and Command -->
    <text x="25" y="70" fill="#4fe0ff">user@engine</text>
    <text x="135" y="70" fill="#7d8b99">:</text>
    <text x="145" y="70" fill="#c7ff7b">~/Bluejay-Timecard</text>
    <text x="315" y="70" fill="#fff">$ python3 main.py</text>

    <!-- Menu Separator -->
    <text x="25" y="100" fill="#2d3748">----------------------------------------------------------------------</text>
    <text x="25" y="120" fill="#a0aec0"><tspan fill="#4fe0ff">1.</tspan> Employees worked for 7 consecutive days</text>
    <text x="25" y="138" fill="#a0aec0"><tspan fill="#4fe0ff">2.</tspan> Employees with gap in range 1 to 10 hours between shifts</text>
    <text x="25" y="156" fill="#a0aec0"><tspan fill="#4fe0ff">3.</tspan> Employees worked more than 14 hours in a single shift</text>
    <text x="25" y="174" fill="#e53e3e"><tspan fill="#e53e3e">Q.</tspan> Exit Engine</text>

    <!-- Query 1 Execution -->
    <text x="25" y="200" fill="#c7ff7b">&gt; Option Selected: 1 [7 Consecutive Days Audit]</text>
    <text x="35" y="222" fill="#edf2f7">Name: <tspan fill="#ffd166">Sparks, KeWWeMh</tspan>         | Position ID: <tspan fill="#4fe0ff">WFS000101</tspan> | Status: <tspan fill="#ff5f56">FLAGGED</tspan></text>
    <text x="35" y="240" fill="#edf2f7">Name: <tspan fill="#ffd166">SiWgh, JaspreeM</tspan>         | Position ID: <tspan fill="#4fe0ff">WFS000424</tspan> | Status: <tspan fill="#ff5f56">FLAGGED</tspan></text>
    <text x="35" y="258" fill="#edf2f7">Name: <tspan fill="#ffd166">CEreira Jr, JEse</tspan>        | Position ID: <tspan fill="#4fe0ff">WFS000456</tspan> | Status: <tspan fill="#ff5f56">FLAGGED</tspan></text>
    <text x="35" y="276" fill="#edf2f7">Name: <tspan fill="#ffd166">GAeWdia, JAaW CarXEs</tspan>    | Position ID: <tspan fill="#4fe0ff">WFS000473</tspan> | Status: <tspan fill="#ff5f56">FLAGGED</tspan></text>

    <!-- Query 2 Execution -->
    <text x="25" y="306" fill="#2d3748">----------------------------------------------------------------------</text>
    <text x="25" y="326" fill="#c7ff7b">&gt; Option Selected: 2 [Shift Rest Gap Audit (1h &lt; gap &lt; 10h)]</text>
    <text x="35" y="348" fill="#edf2f7">Name: <tspan fill="#ffd166">CaMaXaWE, CeghaW</tspan>        | Position ID: <tspan fill="#4fe0ff">WFS000153</tspan> | Gap: <tspan fill="#ffbd2e">5h 20m</tspan></text>
    <text x="35" y="366" fill="#edf2f7">Name: <tspan fill="#ffd166">Xee, XaCar</tspan>              | Position ID: <tspan fill="#4fe0ff">WFS000200</tspan> | Gap: <tspan fill="#ffbd2e">8h 15m</tspan></text>
    <text x="35" y="384" fill="#edf2f7">Name: <tspan fill="#ffd166">De Xa Cerda, IgWaciE</tspan>    | Position ID: <tspan fill="#4fe0ff">WFS000318</tspan> | Gap: <tspan fill="#ffbd2e">7h 45m</tspan></text>
    <text x="35" y="402" fill="#edf2f7">Name: <tspan fill="#ffd166">CEreira Jr, JEse</tspan>        | Position ID: <tspan fill="#4fe0ff">WFS000456</tspan> | Gap: <tspan fill="#ffbd2e">4h 30m</tspan></text>
    <text x="35" y="420" fill="#edf2f7">Name: <tspan fill="#ffd166">DeXgadiXXE REdarMe, C.</tspan>  | Position ID: <tspan fill="#4fe0ff">WFS000523</tspan> | Gap: <tspan fill="#ffbd2e">6h 10m</tspan></text>

    <!-- Query 3 Execution -->
    <text x="25" y="450" fill="#2d3748">----------------------------------------------------------------------</text>
    <text x="25" y="470" fill="#c7ff7b">&gt; Option Selected: 3 [Overtime Violation Audit (&gt; 14 Hours Single Shift)]</text>
    <text x="35" y="492" fill="#edf2f7">Name: <tspan fill="#ffd166">DeXgadiXXE REdarMe, ChrisMiaW S</tspan> | Position ID: <tspan fill="#4fe0ff">WFS000523</tspan> | Shift Duration: <tspan fill="#ff5f56">15h 28m</tspan></text>

    <!-- Exit Banner -->
    <text x="25" y="522" fill="#2d3748">----------------------------------------------------------------------</text>
    <text x="25" y="542" fill="#c7ff7b">&gt; Option Selected: Q</text>
    <text x="25" y="562" fill="#a0aec0">[Process completed successfully. Audit logs generated.]</text>
    <text x="25" y="586" fill="#4fe0ff">user@engine</text>
    <text x="135" y="586" fill="#7d8b99">:</text>
    <text x="145" y="586" fill="#c7ff7b">~/Bluejay-Timecard</text>
    <text x="315" y="586" fill="#fff">$ <tspan fill="#c7ff7b" filter="url(#neonGlow)">▌</tspan></text>
  </g>
</svg>
