    <text x="25" y="102" fill="#d2d7f0" font-family="sans-serif" font-size="11">• Automated Studio Mastering: Dynamic audio overlay ducking BGM by -19dB ensures pristine speech clarity and broadcast-ready podcast quality.</text>
