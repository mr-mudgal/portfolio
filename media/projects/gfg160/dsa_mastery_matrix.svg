    <text x="18" y="28" fill="#7a8d9e" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.05em">Total Completed</text>
    <text x="18" y="58" fill="#27c93f" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="800">160 / 160</text>
    <text x="145" y="56" fill="#c7ff7b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">100%</text>

    <!-- Badge 2 -->
    <rect x="218" y="0" width="200" height="74" rx="10" fill="url(#cardGrad)" stroke="#22334a" stroke-width="1" />
    <text x="236" y="28" fill="#7a8d9e" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.05em">Core Domains</text>
    <text x="236" y="58" fill="#4fe0ff" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="800">12+ Topics</text>

    <!-- Badge 3 -->
    <rect x="436" y="0" width="200" height="74" rx="10" fill="url(#cardGrad)" stroke="#22334a" stroke-width="1" />
    <text x="454" y="28" fill="#7a8d9e" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.05em">Target Complexity</text>
    <text x="454" y="58" fill="#ffd166" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800">O(N) / O(log N)</text>

    <!-- Badge 4 -->
    <rect x="654" y="0" width="206" height="74" rx="10" fill="url(#cardGrad)" stroke="#22334a" stroke-width="1" />
    <text x="672" y="28" fill="#7a8d9e" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.05em">Space Efficiency</text>
    <text x="672" y="58" fill="#9d4edd" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800">In-Place O(1)</text>
  </g>

