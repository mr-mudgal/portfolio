<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <linearGradient id="gfgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#05080f" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="greenPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f855a" />
      <stop offset="100%" stop-color="#38a169" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121a29" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0a0f1a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="920" height="620" rx="16" fill="url(#gfgBg)" stroke="#1a2638" stroke-width="1.5" />

  <!-- Top Window Header -->
  <rect width="920" height="46" rx="16" fill="#0d1420" />
  <rect y="30" width="920" height="16" fill="#0d1420" />
  <line x1="0" y1="46" x2="920" y2="46" stroke="#1f2c40" stroke-width="1" />

  <circle cx="26" cy="23" r="6" fill="#ff5f56" />
  <circle cx="46" cy="23" r="6" fill="#ffbd2e" />
  <circle cx="66" cy="23" r="6" fill="#27c93f" />

  <text x="460" y="28" fill="#889bb0" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" text-anchor="middle">GeeksforGeeks — 160 Days Algorithmic DSA Challenge [160/160 Solved]</text>

  <!-- Header Banner -->
  <g transform="translate(30, 65)">
    <text x="0" y="24" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em">
      GfG 160 Days <tspan fill="#27c93f">Algorithmic Problem Solutions</tspan>
    </text>
    <text x="0" y="44" fill="#7a8d9e" font-family="system-ui, sans-serif" font-size="12.5">
      Comprehensive Python solutions across 160 daily competitive programming and DSA problem directives.
    </text>
  </g>

  <!-- Stat Badges -->
  <g transform="translate(30, 125)">
