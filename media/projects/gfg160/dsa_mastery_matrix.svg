      <rect x="12" y="0" width="836" height="36" rx="6" fill="#101928" />
      <text x="24" y="23" fill="#6d8299" font-family="'JetBrains Mono', monospace" font-size="11">
        Repository: <tspan fill="#4fe0ff">github.com/mr-mudgal/GfG-160-Days</tspan> | Language: <tspan fill="#c7ff7b">Python 3.x</tspan> | Verified Solutions
      </text>
    </g>
