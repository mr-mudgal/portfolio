      <text x="110" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Strings &amp; Pattern Matching</text>
      <text x="420" y="28" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="12">Anagrams, KMP Search Pattern, ATOI Conversion, Min Palindrome Chars</text>
      <text x="750" y="28" fill="#c7ff7b" font-family="'JetBrains Mono', monospace" font-size="11.5">O(N + M)</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 130)">
      <line x1="0" y1="46" x2="860" y2="46" stroke="#131e2e" stroke-width="1" />
      <text x="24" y="28" fill="#4fe0ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Day 21 - 30</text>
      <text x="110" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Sorting &amp; Interval Overlaps</text>
      <text x="420" y="28" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="12">Count Inversions, Merge Intervals, Insert Interval, Rotated Min Search</text>
      <text x="750" y="28" fill="#c7ff7b" font-family="'JetBrains Mono', monospace" font-size="11.5">O(N log N)</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 176)">
      <line x1="0" y1="46" x2="860" y2="46" stroke="#131e2e" stroke-width="1" />
      <text x="24" y="28" fill="#4fe0ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Day 31 - 35</text>
      <text x="110" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Binary Search on Answer</text>
      <text x="420" y="28" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="12">Aggressive Cows, Book Page Allocation, Kth Missing, Peak Element</text>
      <text x="750" y="28" fill="#c7ff7b" font-family="'JetBrains Mono', monospace" font-size="11.5">O(N log M)</text>
    </g>

    <!-- Row 5 -->
    <g transform="translate(0, 222)">
      <line x1="0" y1="46" x2="860" y2="46" stroke="#131e2e" stroke-width="1" />
      <text x="24" y="28" fill="#4fe0ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Day 36 - 41</text>
      <text x="110" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">2D Matrix Traversals</text>
      <text x="420" y="28" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="12">Spiral Traversal, 90° Anti-Clockwise Rotation, Set Matrix Zeroes</text>
      <text x="750" y="28" fill="#c7ff7b" font-family="'JetBrains Mono', monospace" font-size="11.5">O(N × M) / O(1)</text>
    </g>

    <!-- Row 6 (DSA Capstone) -->
    <g transform="translate(0, 268)">
      <text x="24" y="28" fill="#ffd166" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Day 42 - 160</text>
      <text x="110" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">DP, Trees, Graphs, Hashing &amp; Tries</text>
      <text x="420" y="28" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="12">Complete 160-day challenge suite with verified optimal time/space complexity</text>
      <text x="750" y="28" fill="#27c93f" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700">100% SOLVED</text>
    </g>

