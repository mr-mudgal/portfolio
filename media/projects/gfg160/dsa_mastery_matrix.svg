    <rect x="0" y="24" width="860" height="14" fill="#101928" />
    <line x1="0" y1="38" x2="860" y2="38" stroke="#1f2f45" stroke-width="1" />

    <text x="24" y="24" fill="#8ca0b4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DAYS</text>
    <text x="110" y="24" fill="#8ca0b4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CORE ALGORITHMIC PATTERN</text>
    <text x="420" y="24" fill="#8ca0b4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SIGNATURE PROBLEMS &amp; STRATEGIES</text>
    <text x="750" y="24" fill="#8ca0b4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">COMPLEXITY</text>

    <!-- Row 1 -->
    <g transform="translate(0, 38)">
      <line x1="0" y1="46" x2="860" y2="46" stroke="#131e2e" stroke-width="1" />
      <text x="24" y="28" fill="#4fe0ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Day 1 - 10</text>
      <text x="110" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Array Manipulation &amp; Kadane</text>
      <text x="420" y="28" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="12">Second Largest, Move Zeroes, Next Permutation, Max Subarray Sum</text>
      <text x="750" y="28" fill="#c7ff7b" font-family="'JetBrains Mono', monospace" font-size="11.5">O(N) / O(1)</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 84)">
      <line x1="0" y1="46" x2="860" y2="46" stroke="#131e2e" stroke-width="1" />
