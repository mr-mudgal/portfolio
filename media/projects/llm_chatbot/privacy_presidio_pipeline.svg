<svg viewBox="0 0 960 520" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#0c1120"/>
    </linearGradient>
    <linearGradient id="box-user" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="box-presidio" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#311029"/>
      <stop offset="100%" stop-color="#1c0717"/>
    </linearGradient>
    <linearGradient id="box-safe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#062e24"/>
      <stop offset="100%" stop-color="#041a14"/>
    </linearGradient>
    <linearGradient id="box-stream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f1026"/>
    </linearGradient>
  </defs>

  <rect width="960" height="520" fill="url(#bg-grad2)"/>
  <rect x="15" y="15" width="930" height="490" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title Header -->
  <rect x="15" y="15" width="930" height="46" rx="14" fill="#0f172a"/>
  <circle cx="40" cy="38" r="5" fill="#ef4444"/>
  <circle cx="58" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="76" cy="38" r="5" fill="#10b981"/>
  <text x="105" y="42" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">PRESIDIO PII SANITIZATION &amp; SSE TOKEN STREAMING FLOW</text>
  <rect x="740" y="26" width="185" height="24" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="832" y="42" fill="#10b981" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">🛡️ ZERO-LEAK GUARANTEE</text>

  <!-- Step 1: Raw User Input with PII -->
  <g transform="translate(50, 85)">
    <rect width="410" height="175" rx="8" fill="url(#box-user)" stroke="#475569" stroke-width="1.5"/>
    <text x="18" y="26" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold">STEP 1: RAW USER PROMPT (CONTAINS SENSITIVE PII)</text>
    <rect x="18" y="40" width="374" height="115" rx="6" fill="#090d16"/>
    <text x="30" y="65" fill="#e2e8f0" font-family="monospace" font-size="11">"Hi, my name is <tspan fill="#f87171" font-weight="bold">Rishabh Mudgal</tspan> and my email is</text>
    <text x="30" y="85" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold">work.mudgal@proton.me<tspan fill="#e2e8f0" font-weight="normal">. My phone number is</tspan></text>
    <text x="30" y="105" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold">+91-8630473979<tspan fill="#e2e8f0" font-weight="normal">. Can you help summarize this report?"</tspan></text>
    <text x="30" y="135" fill="#94a3b8" font-family="sans-serif" font-size="10">⚠️ Risk: Raw prompt contains Name, Email &amp; Phone Number</text>
  </g>

  <!-- Step 2: Presidio Analyzer & Anonymizer -->
  <g transform="translate(500, 85)">
    <rect width="410" height="175" rx="8" fill="url(#box-presidio)" stroke="#db2777" stroke-width="1.5"/>
    <text x="18" y="26" fill="#f472b6" font-family="monospace" font-size="11" font-weight="bold">STEP 2: MICROSOFT PRESIDIO ANALYZER &amp; ANONYMIZER</text>
    <rect x="18" y="40" width="374" height="115" rx="6" fill="#140612"/>
    <text x="30" y="65" fill="#a78bfa" font-family="monospace" font-size="10.5">anon = analyzer.analyze(text=prompt, language='en')</text>
    <text x="30" y="85" fill="#f472b6" font-family="sans-serif" font-size="10">• Entity PERSON identified: "Rishabh Mudgal" (conf: 0.95)</text>
    <text x="30" y="102" fill="#f472b6" font-family="sans-serif" font-size="10">• Entity EMAIL_ADDRESS identified: "work.mudgal..." (conf: 1.0)</text>
    <text x="30" y="119" fill="#f472b6" font-family="sans-serif" font-size="10">• Entity PHONE_NUMBER identified: "+91-8630..." (conf: 0.85)</text>
    <text x="30" y="140" fill="#38bdf8" font-family="monospace" font-size="10">anonymizer.anonymize(text, analyzer_results=anon)</text>
  </g>

  <!-- Flow Arrow Down -->
  <path d="M 255 265 L 255 295" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3"/>
  <path d="M 705 265 L 705 295" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Step 3: Redacted Payload sent to Ollama -->
  <g transform="translate(50, 300)">
    <rect width="410" height="175" rx="8" fill="url(#box-safe)" stroke="#10b981" stroke-width="1.5"/>
    <text x="18" y="26" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">STEP 3: SANITIZED PROMPT SENT TO OLLAMA (LLAMA 3.2)</text>
    <rect x="18" y="40" width="374" height="115" rx="6" fill="#041510"/>
    <text x="30" y="65" fill="#e2e8f0" font-family="monospace" font-size="11">"Hi, my name is <tspan fill="#34d399" font-weight="bold">&lt;PERSON&gt;</tspan> and my email is</text>
    <text x="30" y="85" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">&lt;EMAIL_ADDRESS&gt;<tspan fill="#e2e8f0" font-weight="normal">. My phone number is</tspan></text>
    <text x="30" y="105" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">&lt;PHONE_NUMBER&gt;<tspan fill="#e2e8f0" font-weight="normal">. Can you help summarize this report?"</tspan></text>
    <text x="30" y="135" fill="#10b981" font-family="sans-serif" font-size="10">✓ 100% Privacy Preserved: Model never sees sensitive credentials</text>
  </g>

  <!-- Step 4: Real-Time SSE Token Stream -->
  <g transform="translate(500, 300)">
    <rect width="410" height="175" rx="8" fill="url(#box-stream)" stroke="#818cf8" stroke-width="1.5"/>
    <text x="18" y="26" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="bold">STEP 4: SERVER-SENT EVENTS (SSE) STREAMING CHUNKS</text>
    <rect x="18" y="40" width="374" height="115" rx="6" fill="#090a18"/>
    <text x="30" y="65" fill="#38bdf8" font-family="monospace" font-size="10.5">StreamingHttpResponse(content_type='text/event-stream')</text>
    <text x="30" y="85" fill="#94a3b8" font-family="monospace" font-size="10">data: {"answer": "Hello"} \n\n</text>
    <text x="30" y="102" fill="#94a3b8" font-family="monospace" font-size="10">data: {"answer": " &lt;PERSON&gt;! How can I help you today?"} \n\n</text>
    <text x="30" y="120" fill="#a78bfa" font-family="monospace" font-size="10">ChatHistory.objects.create(prompt=original, answer=stream)</text>
    <text x="30" y="140" fill="#34d399" font-family="sans-serif" font-size="10">✓ Low-latency typewriter effect in React UI without blocking</text>
  </g>
</svg>
