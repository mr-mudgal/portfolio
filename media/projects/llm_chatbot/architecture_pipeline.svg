    <rect x="12" y="170" width="176" height="52" rx="6" fill="#0d0e26" stroke="#312e81" stroke-width="1"/>
    <text x="22" y="190" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600">💾 ChatWindow Master</text>
    <text x="22" y="207" fill="#94a3b8" font-family="sans-serif" font-size="9.5">UUID sessions &amp; context</text>

