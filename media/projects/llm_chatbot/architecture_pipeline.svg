  <circle cx="40" cy="38" r="5" fill="#ef4444"/>
  <circle cx="58" cy="38" r="5" fill="#f59e0b"/>
  <circle cx="76" cy="38" r="5" fill="#10b981"/>
  <text x="105" y="42" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">PRIVACY-FIRST MULTI-MODEL LLM CHATBOT &amp; INFERENCE PIPELINE</text>
  <rect x="730" y="26" width="195" height="24" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="827" y="42" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">🔒 PRESIDIO + OLLAMA SSE</text>

  <!-- STAGE 1: Client Layer (React 18 + Tailwind) -->
  <g transform="translate(40, 85)">
    <rect width="200" height="390" rx="10" fill="url(#card-grad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="200" height="34" rx="10" fill="#0284c7" opacity="0.25"/>
    <text x="15" y="23" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">STAGE 1: REACT 18 UI</text>
    <text x="15" y="60" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Frontend Client</text>
    <text x="15" y="80" fill="#94a3b8" font-family="monospace" font-size="10.5">Vite + Tailwind CSS</text>

