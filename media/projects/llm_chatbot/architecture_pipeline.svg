    <rect x="12" y="300" width="176" height="52" rx="6" fill="#0d0e26" stroke="#312e81" stroke-width="1"/>
    <text x="22" y="320" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600">🔑 Token Auth &amp; Profiles</text>
    <text x="22" y="337" fill="#94a3b8" font-family="sans-serif" font-size="9.5">IsAuthenticated security</text>

    <text x="15" y="372" fill="#a855f7" font-family="monospace" font-size="9.5">REST API /ask_model</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 705 270 L 725 270" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3"/>

