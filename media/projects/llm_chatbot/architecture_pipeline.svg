    <text x="15" y="372" fill="#38bdf8" font-family="monospace" font-size="9.5">fetch() POST stream:true</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 245 270 L 265 270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

