    <text x="15" y="60" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">Ollama Inference</text>
    <text x="15" y="80" fill="#94a3b8" font-family="monospace" font-size="10.5">Multi-Model Engine</text>

    <rect x="12" y="105" width="171" height="52" rx="6" fill="#061814" stroke="#064e3b" stroke-width="1"/>
    <text x="22" y="125" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">🦙 Llama 3.2 (3B / 1B)</text>
    <text x="22" y="142" fill="#6ee7b7" font-family="sans-serif" font-size="9.5">Ultra-fast general reasoning</text>

    <rect x="12" y="170" width="171" height="52" rx="6" fill="#061814" stroke="#064e3b" stroke-width="1"/>
    <text x="22" y="190" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">🧠 DeepSeek-R1 (8B)</text>
    <text x="22" y="207" fill="#6ee7b7" font-family="sans-serif" font-size="9.5">Chain-of-thought logic</text>

    <rect x="12" y="235" width="171" height="52" rx="6" fill="#061814" stroke="#064e3b" stroke-width="1"/>
    <text x="22" y="255" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">⚡ Subprocess Detection</text>
    <text x="22" y="272" fill="#6ee7b7" font-family="sans-serif" font-size="9.5">ollama list terminal parser</text>

    <rect x="12" y="300" width="171" height="52" rx="6" fill="#061814" stroke="#064e3b" stroke-width="1"/>
    <text x="22" y="320" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">🔒 100% Air-Gapped</text>
    <text x="22" y="337" fill="#6ee7b7" font-family="sans-serif" font-size="9.5">No API keys · Zero telemetry</text>

    <text x="15" y="372" fill="#10b981" font-family="monospace" font-size="9.5">Tokens streamed back ➔</text>
  </g>
</svg>
