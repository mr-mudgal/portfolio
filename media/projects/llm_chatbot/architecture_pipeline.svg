    <rect x="12" y="250" width="176" height="80" rx="6" fill="#1b0e26" stroke="#4a1844" stroke-width="1"/>
    <text x="22" y="270" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="600">⚖️ Enterprise Compliance</text>
    <text x="22" y="287" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">• GDPR &amp; HIPAA Safe</text>
    <text x="22" y="303" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">• 100% On-Premise NLP</text>
    <text x="22" y="319" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">• Zero Data Leakage</text>

    <text x="15" y="372" fill="#ec4899" font-family="monospace" font-size="9.5">Sanitized text forwarded</text>
