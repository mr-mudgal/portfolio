    <rect x="12" y="105" width="176" height="52" rx="6" fill="#091224" stroke="#1e3a5f" stroke-width="1"/>
    <text x="22" y="125" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="600">⚡ SSE Token Parser</text>
    <text x="22" y="142" fill="#64748b" font-family="sans-serif" font-size="9.5">Character streaming display</text>

    <rect x="12" y="170" width="176" height="52" rx="6" fill="#091224" stroke="#1e3a5f" stroke-width="1"/>
    <text x="22" y="190" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="600">🎛️ Multi-Model Switcher</text>
    <text x="22" y="207" fill="#64748b" font-family="sans-serif" font-size="9.5">Dynamic Ollama dropdown</text>

    <rect x="12" y="235" width="176" height="52" rx="6" fill="#091224" stroke="#1e3a5f" stroke-width="1"/>
    <text x="22" y="255" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="600">🛡️ Incognito Privacy Mode</text>
    <text x="22" y="272" fill="#64748b" font-family="sans-serif" font-size="9.5">Client-side session toggle</text>

