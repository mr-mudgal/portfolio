      <tspan x="14" dy="18">• 60ms ± 35ms key delays</tspan>
      <tspan x="14" dy="18">• Cubic Bézier mouse paths</tspan>
      <tspan x="14" dy="18">• Cookie session storage</tspan>
      <tspan x="14" dy="18">• navigator.webdriver mask</tspan>
    </text>
    
    <rect x="14" y="185" width="177" height="30" rx="6" fill="#241704" stroke="#ffd166" stroke-width="1" />
    <text x="102" y="204" fill="#ffd166" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" text-anchor="middle">Zero Flagged Sessions</text>
  </g>

  <!-- Stage 3: Multi-Platform Matrix Dispatcher -->
  <g transform="translate(490, 160)">
    <rect width="195" height="230" rx="12" fill="url(#cardGradSocial)" stroke="#4a2258" stroke-width="1.2" />
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#32143d" />
    <text x="31" y="36" fill="#4fe0ff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🌐</text>
    
    <text x="56" y="28" fill="#c097d8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">STAGE 3</text>
    <text x="56" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Network Matrix</text>
    
    <line x1="14" y1="58" x2="181" y2="58" stroke="#3d1b4a" stroke-width="1" />
    <text x="14" y="80" fill="#cfc2dc" font-family="system-ui, sans-serif" font-size="11.5">
      <tspan x="14" dy="0">• Twitter / X threads &amp; pics</tspan>
      <tspan x="14" dy="18">• LinkedIn articles &amp; pdfs</tspan>
      <tspan x="14" dy="18">• Instagram 4:5 carousels</tspan>
      <tspan x="14" dy="18">• Facebook page updates</tspan>
      <tspan x="14" dy="18">• Pinterest rich pin engine</tspan>
    </text>
    
    <rect x="14" y="185" width="167" height="30" rx="6" fill="#190a21" />
    <text x="97" y="204" fill="#4fe0ff" font-family="'JetBrains Mono', monospace" font-size="10.5" text-anchor="middle">Parallel WebDrivers</text>
  </g>

  <!-- Stage 4: Telemetry, Logs & Alerts -->
  <g transform="translate(710, 160)">
    <rect width="190" height="230" rx="12" fill="url(#cardGradSocial)" stroke="#4a2258" stroke-width="1.2" />
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#32143d" />
    <text x="31" y="36" fill="#c7ff7b" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">📊</text>
    
    <text x="56" y="28" fill="#c097d8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">STAGE 4</text>
    <text x="56" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Audit &amp; Telemetry</text>
    
    <line x1="14" y1="58" x2="176" y2="58" stroke="#3d1b4a" stroke-width="1" />
    <text x="14" y="80" fill="#cfc2dc" font-family="system-ui, sans-serif" font-size="11.5">
      <tspan x="14" dy="0">• Colorama ANSI terminal</tspan>
      <tspan x="14" dy="18">• Real-time error webhooks</tspan>
      <tspan x="14" dy="18">• Auto retry on rate-limit</tspan>
      <tspan x="14" dy="18">• SQLite execution ledger</tspan>
      <tspan x="14" dy="18">• Telegram/Discord alert</tspan>
    </text>
    
    <rect x="14" y="185" width="162" height="30" rx="6" fill="#190a21" />
    <text x="95" y="204" fill="#c7ff7b" font-family="'JetBrains Mono', monospace" font-size="10.5" text-anchor="middle">Colorama Dashboard</text>
  </g>

  <!-- Flow connecting arrows -->
  <path d="M 237 275 L 257 275" stroke="#ff86c8" stroke-width="2" />
  <path d="M 467 275 L 487 275" stroke="#ff86c8" stroke-width="2" />
  <path d="M 687 275 L 707 275" stroke="#ff86c8" stroke-width="2" />

  <!-- Bottom Metric Badges -->
  <g transform="translate(40, 415)">
    <rect width="860" height="110" rx="12" fill="#14081c" stroke="#3d1e4a" stroke-width="1" />

    <g transform="translate(25, 20)">
      <text x="0" y="20" fill="#c097d8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">MANUAL EFFORT REDUCTION</text>
      <text x="0" y="52" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800">-60% Effort</text>
      <text x="0" y="72" fill="#ff86c8" font-family="system-ui, sans-serif" font-size="11.5">Unattended scheduled posting</text>
    </g>

    <g transform="translate(255, 20)">
      <text x="0" y="20" fill="#c097d8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SESSION PERSISTENCE</text>
      <text x="0" y="52" fill="#ffd166" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800">99.8% Survival</text>
      <text x="0" y="72" fill="#ffd166" font-family="system-ui, sans-serif" font-size="11.5">Zero bot flags or bans</text>
    </g>

    <g transform="translate(485, 20)">
      <text x="0" y="20" fill="#c097d8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">TRANSACTION SPEED</text>
      <text x="0" y="52" fill="#4fe0ff" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800">40% Faster</text>
      <text x="0" y="72" fill="#4fe0ff" font-family="system-ui, sans-serif" font-size="11.5">Optimized DOM wait heuristics</text>
    </g>

    <g transform="translate(700, 20)">
      <text x="0" y="20" fill="#c097d8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SUPPORTED PLATFORMS</text>
      <text x="0" y="52" fill="#c7ff7b" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800">5+ Networks</text>
      <text x="0" y="72" fill="#c7ff7b" font-family="system-ui, sans-serif" font-size="11.5">X, LinkedIn, Meta, Pinterest</text>
    </g>
  </g>
</svg>
