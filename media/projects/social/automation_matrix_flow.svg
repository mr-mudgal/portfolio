<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSocial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140b1b" />
      <stop offset="50%" stop-color="#0c0712" />
      <stop offset="100%" stop-color="#050308" />
    </linearGradient>
    <linearGradient id="cardGradSocial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24112c" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#150a1b" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff86c8" />
      <stop offset="100%" stop-color="#b477ff" />
    </linearGradient>
    <style>
      @keyframes pulseDot { 0%, 100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }
      @keyframes flowLine { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
      .pulsing { animation: pulseDot 2s infinite ease-in-out; }
      .flowing { stroke-dasharray: 6, 4; animation: flowLine 1.5s linear infinite; }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="940" height="560" rx="16" fill="url(#bgGradSocial)" stroke="#3a1c44" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <rect width="940" height="46" rx="16" fill="#180c22" />
  <rect y="30" width="940" height="16" fill="#180c22" />
  <line x1="0" y1="46" x2="940" y2="46" stroke="#2d1538" stroke-width="1" />

  <circle cx="26" cy="23" r="6" fill="#ff5f56" />
  <circle cx="46" cy="23" r="6" fill="#ffbd2e" />
  <circle cx="66" cy="23" r="6" fill="#27c93f" />

  <text x="470" y="28" fill="#e0b8ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">
    Social Media Automation Matrix — Anti-Bot Orchestration &amp; Multi-Network Pipeline
  </text>

  <!-- Top Pipeline Header Banner -->
  <g transform="translate(40, 68)">
    <rect x="0" y="0" width="860" height="60" rx="12" fill="#1e0e28" stroke="#ff86c8" stroke-width="1.5" stroke-dasharray="6,4" />
    <text x="30" y="36" fill="#ff86c8" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">AUTOMATION MATRIX V2.4</text>
    <text x="255" y="36" fill="#e2d6ed" font-family="system-ui, sans-serif" font-size="13">
      — Humanized Keystrokes · Bézier Mouse Trajectories · Cookie Serialization · Multi-Platform Dispatch
    </text>
    <rect x="740" y="16" width="95" height="28" rx="6" fill="#3a1542" stroke="#ff86c8" stroke-width="1" />
    <text x="787" y="34" fill="#ff86c8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">99.8% UPTIME</text>
  </g>

  <!-- Stage 1: Content Ingestion & Pre-flight -->
  <g transform="translate(40, 160)">
    <rect width="195" height="230" rx="12" fill="url(#cardGradSocial)" stroke="#4a2258" stroke-width="1.2" />
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#32143d" />
    <text x="31" y="36" fill="#ff86c8" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">📦</text>
    
    <text x="56" y="28" fill="#c097d8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">STAGE 1</text>
    <text x="56" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Pre-Flight Engine</text>
    
    <line x1="14" y1="58" x2="181" y2="58" stroke="#3d1b4a" stroke-width="1" />
    <text x="14" y="80" fill="#cfc2dc" font-family="system-ui, sans-serif" font-size="11.5">
      <tspan x="14" dy="0">• Ingests JSON/CSV queue</tspan>
      <tspan x="14" dy="18">• Pillow aspect ratio check</tspan>
      <tspan x="14" dy="18">• EXIF metadata stripping</tspan>
      <tspan x="14" dy="18">• Dynamic hashtag rotation</tspan>
      <tspan x="14" dy="18">• Caption length validation</tspan>
    </text>
    
    <rect x="14" y="185" width="167" height="30" rx="6" fill="#190a21" />
    <text x="97" y="204" fill="#ff86c8" font-family="'JetBrains Mono', monospace" font-size="10.5" text-anchor="middle">Sanitization Filter</text>
  </g>

