  <g transform="translate(260, 160)">
    <rect width="205" height="230" rx="12" fill="url(#cardGradSocial)" stroke="#ffd166" stroke-width="1.5" />
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#38290f" />
    <text x="31" y="36" fill="#ffd166" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🛡️</text>
    
    <text x="56" y="28" fill="#ffd166" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">STAGE 2 · DEFENSIVE</text>
    <text x="56" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Anti-Bot Shield</text>
    
    <line x1="14" y1="58" x2="191" y2="58" stroke="#4a3614" stroke-width="1" />
    <text x="14" y="80" fill="#cfc2dc" font-family="system-ui, sans-serif" font-size="11.5">
