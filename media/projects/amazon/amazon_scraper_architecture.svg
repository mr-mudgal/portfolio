      <text x="0" y="52" fill="#ff86c8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800">CSV · JSON · SQL</text>
      <text x="0" y="72" fill="#ff86c8" font-family="system-ui, sans-serif" font-size="11.5">Data warehouse ready</text>
