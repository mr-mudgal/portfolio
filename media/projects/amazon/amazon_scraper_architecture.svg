      <tspan x="14" dy="18">• Rotating Proxy Gateway</tspan>
      <tspan x="14" dy="18">• Randomized Sleep Delays</tspan>
      <tspan x="14" dy="18">• Request header spoofing</tspan>
      <tspan x="14" dy="18">• Captcha avoid heuristics</tspan>
    </text>
    
    <rect x="14" y="200" width="167" height="30" rx="6" fill="#041210" />
    <text x="97" y="219" fill="#ffd166" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">Evasion Shield</text>
  </g>

