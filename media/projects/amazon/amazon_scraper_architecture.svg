  </g>

  <!-- Stage 1 -->
  <g transform="translate(40, 150)">
    <rect width="195" height="245" rx="12" fill="url(#cardGradAmazon)" stroke="#1a4d47" stroke-width="1.2" />
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#133833" />
    <text x="31" y="36" fill="#ffd166" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🛡️</text>
    
    <text x="56" y="28" fill="#78b5ad" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">STAGE 1</text>
    <text x="56" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Anti-Bot Evasion</text>
    
