      <stop offset="0%" stop-color="#081816" />
      <stop offset="50%" stop-color="#040e0d" />
      <stop offset="100%" stop-color="#020606" />
    </linearGradient>
    <linearGradient id="cardGradAmazon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b28" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#071715" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="940" height="560" rx="16" fill="url(#bgGradAmazon)" stroke="#1a4d47" stroke-width="1.5" />

  <rect width="940" height="46" rx="16" fill="#0d2421" />
  <rect y="30" width="940" height="16" fill="#0d2421" />
  <line x1="0" y1="46" x2="940" y2="46" stroke="#163b36" stroke-width="1" />

  <circle cx="26" cy="23" r="6" fill="#ff5f56" />
  <circle cx="46" cy="23" r="6" fill="#ffbd2e" />
  <circle cx="66" cy="23" r="6" fill="#27c93f" />

  <text x="470" y="28" fill="#88ded4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">
    Amazon Multi-Stage Web Scraper &amp; Automated ETL Catalog Pipeline Architecture
  </text>

  <g transform="translate(40, 68)">
