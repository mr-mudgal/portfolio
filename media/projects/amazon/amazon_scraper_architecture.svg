  <path d="M 237 270 L 257 270" stroke="#4fe0ff" stroke-width="2" />
  <path d="M 457 270 L 477 270" stroke="#4fe0ff" stroke-width="2" />
  <path d="M 687 270 L 703 270" stroke="#4fe0ff" stroke-width="2" />

  <g transform="translate(40, 415)">
    <rect width="860" height="110" rx="12" fill="#071715" stroke="#143d38" stroke-width="1" />

    <g transform="translate(25, 20)">
      <text x="0" y="20" fill="#78b5ad" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">PARSING ENGINE</text>
      <text x="0" y="52" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800">BeautifulSoup4</text>
      <text x="0" y="72" fill="#4fe0ff" font-family="system-ui, sans-serif" font-size="11.5">Fast lxml tree traversal</text>
    </g>

    <g transform="translate(255, 20)">
      <text x="0" y="20" fill="#78b5ad" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ANTI-BOT DEFENSE</text>
      <text x="0" y="52" fill="#ffd166" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800">Proxy &amp; User-Agent</text>
      <text x="0" y="72" fill="#ffd166" font-family="system-ui, sans-serif" font-size="11.5">Automated evasion rotation</text>
    </g>

    <g transform="translate(500, 20)">
      <text x="0" y="20" fill="#78b5ad" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SCHEMA INTEGRITY</text>
      <text x="0" y="52" fill="#c7ff7b" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800">100% Normalized</text>
      <text x="0" y="72" fill="#c7ff7b" font-family="system-ui, sans-serif" font-size="11.5">Deduplicated ASIN records</text>
    </g>

    <g transform="translate(710, 20)">
