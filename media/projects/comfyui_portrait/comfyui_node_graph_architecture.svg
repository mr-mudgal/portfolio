  <g transform="translate(705, 150)">
    <rect width="195" height="245" rx="12" fill="url(#cardGradComfy)" stroke="#c7ff7b" stroke-width="1.2" />
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#1c3319" />
    <text x="31" y="36" fill="#c7ff7b" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">✨</text>
    
