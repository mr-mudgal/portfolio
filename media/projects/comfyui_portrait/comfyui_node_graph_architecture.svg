      <tspan x="14" dy="18">• Guide Size: 512 | Max: 1024</tspan>
      <tspan x="14" dy="18">• Denoise: 0.24 | Feather: 5</tspan>
      <tspan x="14" dy="18">• BBox Dilation: 10 (Crop: 3.0)</tspan>
      <tspan x="14" dy="18">• Noise mask force_inpaint</tspan>
      <tspan x="14" dy="18">• Restores eyes, pores, iris</tspan>
    </text>
    
    <rect x="14" y="200" width="167" height="30" rx="6" fill="#250b23" stroke="#ff86c8" stroke-width="1" />
    <text x="97" y="219" fill="#ff86c8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">YOLO Facial Inpainting</text>
  </g>

