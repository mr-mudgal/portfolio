      <text x="0" y="52" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800">JuggernautXL v9</text>
      <text x="0" y="72" fill="#4fe0ff" font-family="system-ui, sans-serif" font-size="11.5">DPM++ 2M SDE · 85mm f/1.8 Bokeh</text>
    </g>

    <g transform="translate(255, 20)">
      <text x="0" y="20" fill="#8fb0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">INPAINTING PRECISION</text>
      <text x="0" y="52" fill="#ff86c8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800">YOLOv8m Face</text>
      <text x="0" y="72" fill="#ff86c8" font-family="system-ui, sans-serif" font-size="11.5">FaceDetailer 0.24 Denoise Refine</text>
    </g>

    <g transform="translate(500, 20)">
      <text x="0" y="20" fill="#8fb0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">ZERO-SHOT IDENTITY</text>
      <text x="0" y="52" fill="#b477ff" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800">IP-Adapter FaceID</text>
      <text x="0" y="72" fill="#b477ff" font-family="system-ui, sans-serif" font-size="11.5">InsightFace 512D Embedding Lock</text>
    </g>

    <g transform="translate(710, 20)">
      <text x="0" y="20" fill="#8fb0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">OUTPUT RESOLUTION</text>
      <text x="0" y="52" fill="#c7ff7b" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800">4K / 8K Super-Res</text>
      <text x="0" y="72" fill="#c7ff7b" font-family="system-ui, sans-serif" font-size="11.5">4x-UltraSharp · 16-Bit sRGB PNG</text>
    </g>
