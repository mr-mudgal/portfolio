<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradComfy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1329" />
      <stop offset="50%" stop-color="#070917" />
      <stop offset="100%" stop-color="#02030a" />
    </linearGradient>
    <linearGradient id="cardGradComfy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182042" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1126" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="940" height="560" rx="16" fill="url(#bgGradComfy)" stroke="#27386d" stroke-width="1.5" />

  <!-- Top Window Header Bar -->
  <rect width="940" height="46" rx="16" fill="#121833" />
  <rect y="30" width="940" height="16" fill="#121833" />
  <line x1="0" y1="46" x2="940" y2="46" stroke="#1d2752" stroke-width="1" />

  <circle cx="26" cy="23" r="6" fill="#ff5f56" />
  <circle cx="46" cy="23" r="6" fill="#ffbd2e" />
  <circle cx="66" cy="23" r="6" fill="#27c93f" />

  <text x="470" y="28" fill="#8fb0ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">
    ComfyUI Node Graph Architecture — SDXL Juggernaut v9 · YOLOv8 FaceDetailer · IP-Adapter FaceID · 4x-UltraSharp
  </text>

  <!-- Top Pipeline Header Banner -->
  <g transform="translate(40, 68)">
    <rect x="0" y="0" width="860" height="58" rx="12" fill="#161f42" stroke="#4fe0ff" stroke-width="1.5" stroke-dasharray="6,4" />
    <text x="25" y="35" fill="#4fe0ff" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">COMFYUI PRODUCTION NODE ENGINE</text>
    <text x="330" y="35" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">
