    <text x="97" y="219" fill="#c7ff7b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">4K Tiled Super-Res</text>
  </g>

  <!-- Flow connecting arrows -->
  <path d="M 237 270 L 257 270" stroke="#4fe0ff" stroke-width="2" />
  <path d="M 457 270 L 477 270" stroke="#4fe0ff" stroke-width="2" />
  <path d="M 687 270 L 703 270" stroke="#4fe0ff" stroke-width="2" />

  <!-- Bottom Metric Badges -->
  <g transform="translate(40, 415)">
