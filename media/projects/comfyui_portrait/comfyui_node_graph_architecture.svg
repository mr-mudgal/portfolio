    </text>
    <rect x="740" y="15" width="95" height="28" rx="6" fill="#0a2a44" stroke="#4fe0ff" stroke-width="1" />
    <text x="787" y="33" fill="#4fe0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">SDXL + LoRA</text>
  </g>

  <!-- Stage 1: SDXL Base Generation -->
  <g transform="translate(40, 150)">
    <rect width="195" height="245" rx="12" fill="url(#cardGradComfy)" stroke="#2b407a" stroke-width="1.2" />
    <rect x="14" y="14" width="34" height="34" rx="8" fill="#192850" />
    <text x="31" y="36" fill="#4fe0ff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">🧠</text>
    
    <text x="56" y="28" fill="#8fb0ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">NODE GROUP 1</text>
    <text x="56" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">SDXL Base</text>
    
    <line x1="14" y1="58" x2="181" y2="58" stroke="#1d2d58" stroke-width="1" />
    <text x="14" y="80" fill="#a8b8db" font-family="system-ui, sans-serif" font-size="11">
      <tspan x="14" dy="0">• JuggernautXL_v9.safetensors</tspan>
      <tspan x="14" dy="18">• EmptyLatentImage: 832x1216</tspan>
      <tspan x="14" dy="18">• CLIPTextEncode (Positive 1.3)</tspan>
      <tspan x="14" dy="18">• DPM++ 2M SDE Karras</tspan>
      <tspan x="14" dy="18">• Steps: 35 | CFG: 4.5</tspan>
      <tspan x="14" dy="18">• VAEDecode -> Image Latent</tspan>
